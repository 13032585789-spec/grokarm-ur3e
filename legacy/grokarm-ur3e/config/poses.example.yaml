# Template for the real arm. Copy to config/poses.local.yaml (gitignored).
# Every value must be taught or approved with staff during a slot.
# The real adapter refuses to start unless target is "real",
# approved_by is filled in, and every enabled skill has its waypoints.

target: real
approved_by: ""        # name of the staff member who approved these poses
approved_at: ""        # e.g. 2026-11-05T11:30+01:00

# Joint vectors the arm may start a skill from.
known_poses:
  safe: null           # [q1, q2, q3, q4, q5, q6] in radians

skills:
  go_to_safe_pose:
    waypoints: []      # list of 6-element joint vectors
  point_left:
    waypoints: []
  point_right:
    waypoints: []
