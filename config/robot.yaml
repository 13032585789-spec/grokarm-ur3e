# Robot / work-cell configuration for VOCE.
# Everything marked UNKNOWN must be verified during the supervised hardware slot
# and recorded in PROJECT_STATUS.md. Do not fill values in by guessing.

robot:
  name: "Arm 3"
  vendor: "Universal Robots"
  model: "UR3 (e-Series)"   # dashboard "get robot model" on 2026-11-04
  polyscope_version: "5.11.1.108318" # dashboard "PolyscopeVersion" on 2026-11-04

# ROBOT_MODE env var overrides this. sim | ursim | real
default_mode: ursim

connections:
  ursim:
    # "::1" (IPv6 loopback) on purpose: on the dev Mac, UR's URSim.app (Lima) holds 127.0.0.1:30001-30004,
    # which silently diverted RTDE/URScript to a second, powered-off simulator. Docker also listens on [::].
    # Override with URSIM_HOST if needed.
    host: "::1"
  real:
    host: "192.168.7.21"    # lab Arm 3, wired (PC 192.168.7.50)
    enabled: true
  ports:                    # official UR client interfaces
    dashboard: 29999
    secondary: 30002        # accepts URScript programs
    rtde: 30004             # state feedback (actual_q, actual_qd, runtime_state, ...)
  connect_timeout_s: 3.0

workspace:
  zones: [sinistra, centro, destra]        # subject to verification
  push_directions: [sinistra, destra]      # subject to verification
  # Tray positions are ASSUMED (no camera). Initial assumption at startup:
  trays_assumed_at: [sinistra, destra]

tool:
  description: "Printed tool attachment with fork, pusher and indicating tip (no gripper)"
  # TCP offsets [x, y, z, rx, ry, rz] in m / rad relative to the flange.
  # null = UNKNOWN. Motion uses recorded joint targets, so offsets are not required to move,
  # but they must be measured before any Cartesian feature is added.
  tcp_offsets:
    forca: null
    spintore: null
    punta: null

motion:
  # Joint-space speed/acceleration (rad/s, rad/s^2) and linear (m/s, m/s^2).
  ursim: {joint_speed: 0.8, joint_accel: 0.8, linear_speed: 0.15, linear_accel: 0.5}
  sim:   {joint_speed: 0.8, joint_accel: 0.8, linear_speed: 0.15, linear_accel: 0.5}
  real:  {joint_speed: 0.25, joint_accel: 0.3, linear_speed: 0.05, linear_accel: 0.2}  # conservative
  stop_decel: 3.0               # rad/s^2 used by stopj()
  joint_tolerance_rad: 0.01     # actual_q vs target to accept "arrived"
  moving_speed_eps: 0.005       # |actual_qd| below this = not moving

inspection:
  # Quality-inspection cell: Tray A = input, Tray B = approved, Tray C = rejected.
  # Zones are the workspace zones above; labels are what the operator says and sees.
  input_zone: sinistra
  pass_zone: centro
  fail_zone: destra
  labels: {sinistra: A, centro: B, destra: C}
  inspect_pose: ispezione      # pose in poses.yaml: item held ~10 cm in front of the static camera
  settle_s: 0.8                # hold still before the frame is taken
  max_frame_age_s: 2.0         # refuse frames older than this (camera frozen / unplugged)

cups:
  # zones left-to-right AS SEEN IN THE CAMERA IMAGE (reverse it if the phone faces the robot)
  image_zone_order: [sinistra, centro, destra]
  zone_cuts: [0.3333, 0.6667]     # x positions (fraction of image width) of the zone borders
  roi: [0.0, 0.0, 1.0, 1.0]       # x0 y0 x1 y1 fractions: crop to the table, keep the arm out
  min_saturation: 90
  min_value: 60
  min_area_frac: 0.002
  max_area_frac: 0.25
  max_frame_age_s: 2.0
  diff_threshold: 30             # background mode (after 'empty table' photo): any colour incl. white/black
  grok_fallback: true            # ask Grok Vision when the named colour is not found locally (needs XAI_API_KEY)

safety:
  confirmation_ttl_s: 20
  execution_timeout_margin_s: 5
  stop_on_voice_loss: true      # voice channel lost while moving -> STOP (fail-safe; STOP button still works)
